# The game, built from this fork's source and published as the `nightly` pre-release. Upstream
# changes reach main through sync-upstream.yml; this builds them into the game client players get.
# No private runner and no third-party nightly files: the launcher downloads and verifies Mojang's
# game files itself. Each archive carries this fork's programs, research-lock.json and the
# preparer's Java sources, so a fresh install can prepare 26.3 without another launcher or account.
# The checksums are signed with this fork's key for both the channel (`nightly`) and the build's
# own version.
name: game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-nightly
  cancel-in-progress: true

env:
  HORIZON_TELEMETRY_URL: "off"
  HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            asset: horizon-linux-x86_64.tar.gz
            suffix: ""
          - name: windows
            os: windows-latest
            asset: horizon-windows-x64.zip
            suffix: .exe
            rustflags: -C target-feature=+crt-static
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: horizon-windows-arm64.zip
            suffix: .exe
            rustflags: -C target-feature=+crt-static
            optional: true
          - name: macos
            os: macos-15
            asset: horizon-macos-arm64.zip
            suffix: ""
          - name: macos-x64
            os: macos-15
            target: x86_64-apple-darwin
            asset: horizon-macos-x64.zip
            suffix: ""
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 180
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: game-${{ matrix.name }}
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libasound2-dev libudev-dev
      - name: Build the game's programs
        run: |
          set -euo pipefail
          # macOS runners use bash 3.2, where expanding an empty array under `set -u` fails.
          target_args=""
          if [[ -n "${{ matrix.target }}" ]]; then target_args="--target ${{ matrix.target }}"; fi
          cargo build --release --locked $target_args \
            -p horizon-client --bin horizon-client \
            -p horizon-client-lib --bin horizon-ctl \
            -p horizon-prepare --bin horizon-prepare \
            -p horizon-server --bin horizon-server
          out=target/release; [[ -n "${{ matrix.target }}" ]] && out="target/${{ matrix.target }}/release"
          mkdir -p dist/horizon
          for program in horizon-client horizon-ctl horizon-prepare horizon-server; do
            cp "$out/$program${{ matrix.suffix }}" "dist/horizon/$program${{ matrix.suffix }}"
            chmod +x "dist/horizon/$program${{ matrix.suffix }}"
          done
          # The launcher reads these from its installed version to pin Mojang's files and to
          # compile the vanilla exporters when the archive has no precompiled bundle.
          cp research-lock.json LICENSE dist/horizon/
          mkdir -p dist/horizon/crates/horizon-prepare \
                   dist/horizon/mods/horizon/src/test/java/dev/horizonlab/parity
          cp -r crates/horizon-prepare/. dist/horizon/crates/horizon-prepare/
          cp -r mods/horizon/src/test/java/dev/horizonlab/parity/. \
                dist/horizon/mods/horizon/src/test/java/dev/horizonlab/parity/
          # The exporter classes compiled from those sources against the pinned jars: without
          # them a player would need a JDK installed. Stored as one archive, never loose .class.
          mkdir -p dist/horizon/exporters
          tar -xzf exporters.tar.gz -C dist/horizon/exporters
          # What the game reports as its version; the release's own version is in the tag.
          echo "HORIZON_VERSION=nightly-$(date -u +%F)-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          cd dist
          case "${{ matrix.asset }}" in
            *.tar.gz) tar -czf "${{ matrix.asset }}" horizon ;;
            *.zip) if [[ "$RUNNER_OS" == Windows ]]; then 7z a -tzip "${{ matrix.asset }}" horizon > /dev/null
                   else ditto -c -k --norsrc --noextattr --noqtn --keepParent horizon "${{ matrix.asset }}"; fi ;;
          esac
          rm -rf horizon
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: game-${{ matrix.name }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: game-*
          merge-multiple: true
      - name: Nightly version
        id: nightly
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Sign the checksums (SHA256SUMS.sig and SHA256SUMS.v2.sig)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          ALSO_FOR: nightly-${{ steps.nightly.outputs.date }}-${{ steps.nightly.outputs.short }}
        run: |
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "::error::The RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          for required in horizon-linux-x86_64.tar.gz horizon-windows-x64.zip horizon-macos-arm64.zip \
                          horizon-macos-x64.zip; do
            [[ -f "dist/$required" ]] || { echo "::error::dist/$required was not built"; exit 1; }
          done
          arm64=(); if [[ -f dist/horizon-windows-arm64.zip ]]; then arm64=(dist/horizon-windows-arm64.zip)
          else echo "::warning::horizon-windows-arm64.zip is missing; Windows ARM64 falls back to x64"; fi
          bash tools/ci/sign_release.sh nightly dist/horizon-linux-x86_64.tar.gz dist/horizon-windows-x64.zip \
            ${arm64[@]+"${arm64[@]}"} dist/horizon-macos-arm64.zip dist/horizon-macos-x64.zip
      - uses: dtolnay/rust-toolchain@stable
      - name: The signatures, checked as launchers check them
        env:
          DATE: ${{ steps.nightly.outputs.date }}
          SHORT: ${{ steps.nightly.outputs.short }}
        run: |
          cargo run --locked --quiet -p horizon-release-sign -- verify --tag nightly --publishing dist
          cargo run --locked --quiet -p horizon-release-sign -- verify --tag "nightly-${DATE}-${SHORT}" \
            --signature SHA256SUMS.v2.sig --publishing dist
      - name: Publish as the `nightly` pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.nightly.outputs.date }}
          SHORT: ${{ steps.nightly.outputs.short }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Nightly $DATE · $SHORT, built from this fork's source. The launcher installs it by itself;
          Minecraft 26.3 is downloaded from Mojang on first use, without another launcher or account.
          EOF
          python3 tools/ci/nightly.py rotate
          arm64=()
          if [[ -f dist/horizon-windows-arm64.zip ]]; then
            arm64=("dist/horizon-windows-arm64.zip#Game client: Windows ARM64 (horizon-windows-arm64.zip)")
          fi
          gh release create nightly --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Nightly $DATE · $SHORT" --notes-file notes.md \
            "dist/horizon-linux-x86_64.tar.gz#Game client: Linux (horizon-linux-x86_64.tar.gz)" \
            "dist/horizon-windows-x64.zip#Game client: Windows x64 (horizon-windows-x64.zip)" \
            ${arm64[@]+"${arm64[@]}"} \
            "dist/horizon-macos-arm64.zip#Game client: macOS on Apple Silicon (horizon-macos-arm64.zip)" \
            "dist/horizon-macos-x64.zip#Game client: macOS on Intel (horizon-macos-x64.zip)" \
            dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.v2.sig
          python3 tools/ci/nightly.py prune --days 7
