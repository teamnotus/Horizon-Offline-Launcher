# Keep this fork current with Horizon's live repository. Every day (or on demand) the game's source,
# manifests and lockfile are taken from upstream/main; this fork's launcher, release workflows,
# install scripts, docs and signing key stay untouched. The result is tested before a PR is opened
# and merged automatically. If a change breaks the launcher, the PR stays open with the failing
# check instead of reaching players.
name: sync upstream

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    env:
      HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            launcher
      - name: Libraries GPUI links to
        run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev libudev-dev
      - name: Take the game from upstream
        id: sync
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/rdbtCVS/horizon.git || git remote set-url upstream https://github.com/rdbtCVS/horizon.git
          git fetch --no-tags upstream main
          git checkout -B sync/upstream origin/main
          # Start from upstream's exact tree: a plain `checkout FETCH_HEAD -- .` leaves files
          # upstream deleted behind (old build scripts then break the new crates).
          git rm -rf --quiet .
          git checkout FETCH_HEAD -- .
          # What this fork owns: the offline launcher, its releases and its identity.
          rm -rf launcher .github
          git checkout origin/main -- launcher .github exporters.tar.gz
          # Overlay this fork's packaging (the installer and its URLs) on upstream's: upstream
          # also ships files the build needs, such as packaging/windows/exe.rs.
          git checkout origin/main -- packaging
          git checkout origin/main -- crates/horizon-release-sign/release-keys.txt \
            README.md AGENTS.md install.ps1 install.sh build.ps1
          # Upstream declares hooks in Rust now; a stale fork copy makes its build script fail.
          if git cat-file -e FETCH_HEAD:native-hooks.json 2>/dev/null; then
            git checkout origin/main -- native-hooks.json
          else
            rm -f native-hooks.json
          fi
          # Upstream folded content mods into a new mod system; the offline launcher still uses
          # this crate, so keep it and put it back in the workspace.
          git checkout origin/main -- crates/horizon-mods
          # Upstream's shader API now checks its version while reading a pack; the fork's registry
          # still refers to the type that API removed. Keep the crate compiling on both trees.
          if ! grep -Rsq 'pub enum Api' crates/horizon-shader-api/src; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/horizon-mods/src/index.rs')
          s = p.read_text()
          start = s.index('            // Players get only what the game draws without a switch')
          end = s.index('        Kind::ShaderPack =>', start)
          new = "\n".join([
              "            // Upstream's shader API checks its own version when it reads the pack.",
              "            Ok(Facts {",
              "                id: Some(m.id),",
              "                version: Some(m.version),",
              "                api: horizon_shader_api::API.to_owned(),",
              "                ..Facts::default()",
              "            })",
              "        }",
              "",
          ])
          p.write_text(s[:start] + new + s[end:])
          PY
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          if '"crates/horizon-mods"' not in s:
              s = s.replace('members = [\n', 'members = [\n    "crates/horizon-mods",\n', 1)
          p.write_text(s)
          PY
          git add -A
          if git diff --cached --quiet origin/main; then
            echo "up_to_date=1" >> "$GITHUB_OUTPUT"
            echo "Upstream is already here"
            exit 0
          fi
          echo "up_to_date=0" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          git diff --cached --stat | tail -20
      - name: The fork's offline guarantees survive the sync
        if: steps.sync.outputs.up_to_date == '0'
        run: |
          set -euo pipefail
          grep -q 'teamnotus/Horizon-Offline-Launcher' launcher/src/backend.rs
          grep -q 'fn download_from_mojang' launcher/src/backend.rs
          ! grep -q 'download_for_owner' launcher/src/backend.rs
          grep -q 'MogBSp7EXM7IvkdnlwA5lwGb1HEu3uHTm4cHQHcnQEk=' crates/horizon-release-sign/release-keys.txt
          test -f .github/workflows/game.yml
      - name: Adapt the launcher to upstream's current APIs
        if: steps.sync.outputs.up_to_date == '0'
        run: |
          set -euo pipefail
          # Upstream moved NBT to horizon-core; the launcher imports it from horizon-world.
          # One re-export lets the same launcher source compile against both trees.
          if ! grep -q 'pub mod nbt' crates/horizon-world/src/lib.rs; then
            printf '\npub use horizon_core::nbt;\n' >> crates/horizon-world/src/lib.rs
          fi
          # Upstream renamed the Nightly helpers; keep the names the launcher and its tests call.
          if ! grep -q 'pub fn nightly_title_version' crates/horizon-release-sign/src/lib.rs; then
            cat >> crates/horizon-release-sign/src/lib.rs <<'RS'

          pub fn nightly_title_version(title: &str) -> Option<String> {
              build_title_version(Channel::Nightly, title)
          }

          pub fn nightly_digest(
              version: &str,
              asset: &str,
              sums: Option<&[u8]>,
              signature: Option<&str>,
              keys: &[PublicKey],
          ) -> Result<String, String> {
              build_digest(Channel::Nightly, version, asset, sums, signature, keys)
          }
          RS
          fi
          # Upstream dropped the trait-injection API the launcher still uses to build native
          # mods pinned to older source revisions. Put that API beside upstream's generated one.
          if ! grep -q 'pub fn inject' crates/horizon-mod-api-gen/src/lib.rs; then
            git show origin/main:crates/horizon-mod-api-gen/src/injection.rs > crates/horizon-mod-api-gen/src/injection.rs
            git show origin/main:crates/horizon-mod-api-gen/src/build.rs > "$RUNNER_TEMP/fork-mod-api-build.rs"
            python3 - <<'PY'
          from pathlib import Path
          import os
          src = Path(os.environ['RUNNER_TEMP'] + '/fork-mod-api-build.rs').read_text()
          start = src.index('#[derive(serde::Deserialize)]')
          end = src.index('\n}\n', src.index('file.items.extend(structs);')) + len('\n}\n')
          body = 'use quote::ToTokens;\nuse std::collections::HashSet;\n\n' + src[start:end]
          Path('crates/horizon-mod-api-gen/src/inject_compat.rs').write_text(body)
          p = Path('crates/horizon-mod-api-gen/src/lib.rs')
          s = p.read_text()
          s = s.replace('pub use catalog::DECLARATIONS;',
                        'pub use catalog::DECLARATIONS;\nmod injection;\npub use injection::{TraitContract, TraitInjection};\nmod inject_compat;\npub use inject_compat::inject;', 1)
          p.write_text(s)
          PY
          fi
          # Upstream's modpack porter now takes the hosts it may download from.
          if grep -q 'pipeline::port(work, resources, from, log)' launcher/src/modpacks.rs; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('launcher/src/modpacks.rs')
          s = p.read_text().replace(
              'pipeline::port(work, resources, from, log)?;',
              'pipeline::port(\n        work,\n        resources,\n        from,\n        horizon_addresses::MODPACK_DOWNLOAD_HOSTS,\n        log,\n    )?;', 1)
          p.write_text(s)
          p = Path('launcher/Cargo.toml')
          s = p.read_text()
          if 'horizon-addresses' not in s:
              s = s.replace('horizon-port-pack = ',
                            'horizon-addresses = { path = "../crates/horizon-addresses" }\nhorizon-port-pack = ', 1)
          p.write_text(s)
          PY
          fi
          # Upstream's themes paint a sky mood and a skyline cut; the launcher's two skies
          # keep their look with the plain ones.
          if grep -q 'pub mood: Mood' crates/horizon-theme/src/night.rs && ! grep -q 'mood: Mood' launcher/src/themes.rs; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('launcher/src/themes.rs')
          s = p.read_text()
          s = s.replace('use horizon_theme::night::{Night, SkyArt};',
                        'use horizon_theme::night::{Land, Mood, Night, SkyArt};', 1)
          for star in ['0xeceff4', '0xffffff']:
              s = s.replace(f'        star: {star},\n    }},',
                            f'        star: {star},\n        mood: Mood::Plain,\n        land: Land::Plain,\n    }},', 1)
          p.write_text(s)
          PY
          fi
          git add -A
      - name: Rebuild the exporter classes when the pinned game files change
        if: steps.sync.outputs.up_to_date == '0'
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/exporters"
          mkdir -p "$work/home/versions/local/crates/horizon-prepare" \
                   "$work/home/versions/local/mods/horizon/src/test/java/dev/horizonlab/parity" \
                   "$work/game" "$work/xdg-data" "$work/xdg-config"
          cp research-lock.json "$work/home/versions/local/"
          cp -r crates/horizon-prepare/. "$work/home/versions/local/crates/horizon-prepare/"
          cp -r mods/horizon/src/test/java/dev/horizonlab/parity/. \
                "$work/home/versions/local/mods/horizon/src/test/java/dev/horizonlab/parity/"
          touch "$work/home/versions/local/.installed"
          cargo build --release --manifest-path launcher/Cargo.toml -p horizon-launcher --bin horizon-launcher
          HORIZON_LAUNCHER_HOME="$work/home" HORIZON_LAUNCHER_NO_SELF_UPDATE=1 HORIZON_HOME="$work/game" \
          XDG_DATA_HOME="$work/xdg-data" XDG_CONFIG_HOME="$work/xdg-config" \
            launcher/target/release/horizon-launcher prepare --download --version local
          key=$(python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('.')
          h = hashlib.sha256()
          h.update(b'exporters-v1 --release -proc:none -encoding UTF-8')
          h.update((root / 'crates/horizon-prepare/src/exporters.rs').read_bytes().replace(b'\r', b''))
          srcs = sorted(p for p in (root / 'mods/horizon/src/test/java/dev/horizonlab/parity').rglob('*.java'))
          srcs.append(root / 'research-lock.json')
          for p in srcs:
              data = p.read_bytes().replace(b'\r', b'')
              h.update(f'{p.relative_to(root).as_posix()}\0{len(data)}\0'.encode())
              h.update(data)
          print(h.hexdigest())
          PY
          )
          bundle="$work/home/versions/local/.local/exporters/$key"
          test -f "$bundle/manifest.json"
          rm -f "$bundle"/*.log
          tar -czf exporters.tar.gz -C "$bundle" manifest.json client server
          git add exporters.tar.gz
      - name: Build and test the result
        if: steps.sync.outputs.up_to_date == '0'
        run: |
          set -euo pipefail
          cargo check --workspace
          (cd launcher && cargo test --release)
          git add Cargo.lock launcher/Cargo.lock
      - name: Push and open the PR
        if: steps.sync.outputs.up_to_date == '0'
        run: |
          set -euo pipefail
          git -c user.name='teamnotus' -c user.email='teamnotus@users.noreply.github.com' \
            commit -m "sync: game source from rdbtCVS/horizon"
          git push --force origin sync/upstream
          body=$(cat <<EOF
          Game source, manifests and lockfile from \`rdbtCVS/horizon@${{ steps.sync.outputs.upstream }}\`. The offline launcher, its release flows and its signing key stay this fork's. Merging publishes a new game Nightly and a new launcher release.
          EOF
          )
          if gh pr view sync/upstream --json number > /dev/null 2>&1; then
            gh pr edit sync/upstream --body "$body"
          else
            gh pr create --base main --head sync/upstream --title "sync: game source from upstream" --body "$body"
          fi
          gh pr merge sync/upstream --auto --squash || echo "::warning::Auto-merge is not enabled; the PR is open for review"
