# Horizon Offline Launcher: tests on every push and pull request; a tag `launcher@1.2.3` builds the
# launcher for Windows x64 (with its installer) and Linux x86_64 (AppImage and tar.gz), signs
# the checksums and publishes them as a GitHub release, which launchers already installed update
# themselves from.
name: launcher

on:
  push:
    branches: [main]
    tags: ['launcher@*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  # The tests run once, on Linux: some of upstream's tests depend on the machine (the trash on
  # Windows, macOS on a hosted runner), and a build never waits for them.
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HORIZON_LAUNCHER_NO_SELF_UPDATE: "1"
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
      - name: Libraries GPUI links to
        run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev
      - run: cargo test --release --locked

  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            binary: horizon-launcher.exe
            asset: horizon-launcher-windows-x64.zip
            rustflags: -C target-feature=+crt-static
          - name: linux
            os: ubuntu-22.04
            binary: horizon-launcher
            asset: horizon-launcher-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          key: ${{ matrix.name }}
      - name: Linux libraries GPUI links to
        if: runner.os == 'Linux'
        run: bash "$GITHUB_WORKSPACE/tools/ci/apt_install.sh" libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf
      # A tag launcher@1.2.3 is the launcher's version 1.2.3; other builds say Cargo.toml's.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/launcher@')
        run: |
          echo "HORIZON_LAUNCHER_VERSION=${GITHUB_REF_NAME#launcher@}" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
      - run: cargo build --release --locked ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"}
      - name: Package
        run: |
          mkdir -p ../dist
          out=target/release
          case "${{ matrix.name }}" in
            windows*) 7z a -tzip ../dist/${{ matrix.asset }} "./$out/${{ matrix.binary }}" > /dev/null ;;
            linux) tar -czf ../dist/${{ matrix.asset }} -C "$out" ${{ matrix.binary }} ;;
          esac
          if [[ "${{ matrix.name }}" == linux ]]; then
            # The download most people use: one file, with the libraries GPUI links to beside the
            # binary. The tar.gz above stays for machines without FUSE.
            version=${HORIZON_LAUNCHER_VERSION:-$("$out/${{ matrix.binary }}" --version | cut -d' ' -f2)}
            bash "$GITHUB_WORKSPACE/packaging/linux/appimage.sh" \
              "$out/${{ matrix.binary }}" "$version" ../dist
          fi
      # The installer most people download (packaging/windows/setup.iss); the zip stays what
      # launchers update themselves from.
      - name: Windows installer
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $version = if ($env:HORIZON_LAUNCHER_VERSION) { $env:HORIZON_LAUNCHER_VERSION } else { "0.0.0" }
          & $iscc /Q "/DAppVersion=$version" "/DSource=$PWD\target\release\horizon-launcher.exe" "/O$PWD\..\dist" ..\packaging\windows\setup.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem ..\dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'windows'
        with:
          name: Horizon-Offline-Launcher-Setup.exe
          path: dist/Horizon-Offline-Launcher-Setup.exe
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'linux'
        with:
          name: horizon-launcher-linux-x86_64.AppImage
          path: dist/horizon-launcher-linux-x86_64.AppImage

  release:
    needs: [test, build]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/launcher@') && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign the checksums (SHA256SUMS, SHA256SUMS.sig)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [[ -n "$RELEASE_SIGNING_KEY" ]] || { echo "::error::The RELEASE_SIGNING_KEY secret is not set"; exit 1; }
          bash tools/ci/sign_release.sh "$GITHUB_REF_NAME" dist/*
      - name: The Linux binaries start and say this release's version
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#launcher@}
          chmod +x dist/horizon-launcher-linux-x86_64.AppImage
          got=$(dist/horizon-launcher-linux-x86_64.AppImage --appimage-extract-and-run --version | cut -d' ' -f2)
          [[ "$got" == "$version" ]] || { echo "AppImage is $got, expected $version"; exit 1; }
          tmp=$(mktemp -d)
          tar -xzf dist/horizon-launcher-linux-x86_64.tar.gz -C "$tmp"
          got=$("$tmp/horizon-launcher" --version | cut -d' ' -f2)
          [[ "$got" == "$version" ]] || { echo "tar.gz is $got, expected $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - name: The signature, checked as launchers check it
        run: cargo run --locked --quiet -p horizon-release-sign -- verify --tag "$GITHUB_REF_NAME" dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Horizon Offline Launcher ${{ github.ref_name }}
          files: |
            dist/*
            install.ps1
            install.sh
          make_latest: true
          generate_release_notes: true
